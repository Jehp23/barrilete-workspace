# tmux estilo Gentleman (base: Gentleman.Dots/GentlemanTmux/tmux.conf), adaptado al workspace Barrilete.
# Cambios respecto del original:
#   - sin vim-tmux-navigator: no hay Neovim y sus Ctrl+h/j/k/l pisan atajos de Claude Code
#     (Ctrl+j = salto de línea). Panes: prefijo + h/j/k/l.
#   - barra Kanagawa solo con git: cpu/ram ya están en Sketchybar.
#   - atajos para los agentes de `bk` (sesión "agents").

# ---------- plugins (TPM) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Tema Kanagawa (dragon), como Gentleman
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "git"
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-show-powerline true
set -g @kanagawa-show-left-icon session

# ---------- terminal y teclas ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -sg escape-time 10

# Modo vi y portapapeles
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Seleccionar con el mouse ya copia al portapapeles al soltar (cmd+c no hace falta: con tmux la
# selección es de tmux, no de Ghostty)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Prefijo Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits en el directorio actual: v = vertical (lado a lado), d = horizontal
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Panes estilo vim (reemplaza a vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on
set -g status-position top

# Matar todas las otras sesiones
bind K confirm-before -p "¿Matar todas las otras sesiones? (y/n)" "kill-session -a"

# Ventanas y panes desde 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Ventana flotante (scratch) con Alt+x, en el directorio actual
# (en Gentleman es Alt+g; acá Alt+g es el visor de cambios, como en gentle-shell)
bind-key -n M-x if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -E -k "tmux new-session -A -s scratch"
}

# ---------- Barrilete ----------
# prefijo + a : ir a la sesión de agentes de bk (elegir ventana)
bind a if-shell 'tmux has-session -t agents' 'choose-tree -Zw -f "#{==:#{session_name},agents}"' 'display-message "no hay agentes (bk run / bk plan)"'
# prefijo + s : sesiones de Claude estilo Orca (abiertas: saltar · recientes: retomar)
bind s display-popup -w 90% -h 75% -E "bk s"

# Overlays a lo Gentle Shell (sin prefijo): alt+a agentes · alt+g cambios · alt+k comandos · alt+s sesiones
# · alt+u stats · alt+, customize · alt+1…9 workspaces · alt+0 volver · alt+q salir de un agente
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#f095c8'
bind-key -n M-a display-popup -w 92% -h 88% -d "#{pane_current_path}" -T " ∗ Agents " -E "bk watch --all"
bind-key -n M-g display-popup -w 92% -h 88% -d "#{pane_current_path}" -E "bk changes"
bind-key -n M-k display-popup -w 70% -h 70% -d "#{pane_current_path}" -E "bk palette"
bind-key -n M-s display-popup -w 90% -h 75% -d "#{pane_current_path}" -E "bk s"
# alt+1…9: ir al workspace N de la tira izquierda (orden de creación)
bind-key -n M-1 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 1)"'
bind-key -n M-2 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 2)"'
bind-key -n M-3 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 3)"'
bind-key -n M-4 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 4)"'
bind-key -n M-5 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 5)"'
bind-key -n M-6 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 6)"'
bind-key -n M-7 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 7)"'
bind-key -n M-8 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 8)"'
bind-key -n M-9 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 9)"'
bind-key -n M-u display-popup -w 92% -h 85% -d "#{pane_current_path}" -E "bk stats"
unbind-key -n M-c
# Customize en alt+, (como cmd+, en macOS). No alt+c: Ghostty pasa cmd+c sin selección y llega como alt+c
bind-key -n M-, display-popup -w 80% -h 60% -d "#{pane_current_path}" -E "bk customize"

# Volver: alt+0 a la sesión anterior; alt+q en la sesión agents vuelve (o cierra el popup del agente)
bind-key -n M-0 switch-client -l
bind-key -n M-q if-shell -F '#{==:#{session_name},agents}' {
  if-shell -F '#{client_last_session}' 'switch-client -l' 'detach-client'
} {
  send-keys M-q
}
# prefijo + A : `bk ls` en un popup
bind A display-popup -w 90% -h 50% -E "bk ls; echo; bk tokens | head -2; read -n 1 -s -r -p '  (cualquier tecla para cerrar)'"
# Ventana de un agente que terminó: no acepta teclas; decir cómo seguir
set -g remain-on-exit-format " el agente terminó · C-a s → enter lo retoma acá · C-a & cierra la ventana "
# Que la ventana de un agente que terminó se vea marcada
setw -g monitor-activity on
set -g visual-activity off

# Recargar config: prefijo + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recargado"

# Salir de tmux dejando los agentes corriendo: prefijo + D
# (en el estilo Gentleman `d` divide la ventana, así que el detach por defecto no existe)
bind D detach-client

# ---------- TPM (siempre al final) ----------
run '~/.tmux/plugins/tpm/tpm'

# Después de TPM: el tema le pone fondo gris a los popups; que usen el fondo de la terminal
set -g popup-style 'bg=default,fg=default'
