# Catálogo de modelos que ofrecen bk models y el panel de perfiles (alt+k). Uno por renglón:
#   <provider>/<modelo>   descripción
# Codex se lee además de la CLI (codex debug models, se guarda un día); Claude Code y Gemini no tienen cómo
# listarlos, así que van acá. Sumá los tuyos en ~/.config/bk/models.yml con el mismo formato: se agregan a estos.
# Un modelo que no está acá igual se puede usar: «Otro…» en el panel o bk profile set / bk ask set a mano.

claude/opus                    Opus, el más nuevo (alias)
claude/sonnet                  Sonnet, el más nuevo (alias)
claude/haiku                   Haiku, el más nuevo (alias)
claude/claude-opus-5-5         Opus 5.5
claude/claude-sonnet-5-5       Sonnet 5.5
claude/claude-haiku-5-5        Haiku 5.5
claude/claude-fable-5-2        Fable 5.2

gemini/gemini-3.1-pro-preview  Gemini 3.1 Pro (preview)
gemini/gemini-3.5-flash        Gemini 3.5 Flash
gemini/gemini-3.1-flash-lite   Gemini 3.1 Flash-Lite
